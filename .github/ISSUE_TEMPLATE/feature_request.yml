name: Feature request
description: Suggest an improvement to the updater or developer interface.
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help someone do?
      description: Describe the user problem and an example of the desired behaviour.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: How would you like it to work? Examples or sketches are welcome.
