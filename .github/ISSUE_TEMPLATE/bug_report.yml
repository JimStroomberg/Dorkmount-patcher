name: Bug report
description: Something not working? Tell us what happened.
body:
  - type: markdown
    attributes:
      value: >-
        If an update stopped, keep the keyboard connected and check the Troubleshooting guide linked from the README.
        Please leave firmware files, full update logs and personal information out of attachments.
  - type: input
    id: version
    attributes:
      label: App version, package/build and operating system
      placeholder: 'Example: 0.2.0b1, CachyOS, Wayland'
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
      description: Include reproduction steps and the stage shown by the app.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Error message and anything you have tried
      description: Copy the relevant error text and tell us whether the keyboard still works.
